[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartgarden"
version = "0.1.0"
description = "Adaptive and predictive control system for plant growth environments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

authors = [
  { name = "Slav Petkovic" }
]

dependencies = [
  "fastapi>=0.128.0",
  "uvicorn[standard]>=0.40.0",
  "python-dotenv>=1.2.1",
  "jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black>=24.0",
  "ruff>=0.4",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "I"]
